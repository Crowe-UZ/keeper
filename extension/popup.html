<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<style>
  :root {
    --bg: #16161b; --card: #212129; --card-hover: #292933; --line: #30303b;
    --text: #ededf2; --muted: #9c9cab; --accent: #6d5efc; --accent-2: #3b82f6;
    --ok: #34d399; --bad: #f87171; --warn: #fbbf24;
  }
  * { box-sizing: border-box; }
  /* прокрутка колесом работает, но сама полоса не видна — она портила вид */
  html { scrollbar-width: none; }
  ::-webkit-scrollbar { display: none; }
  body { width: 400px; margin: 0; padding: 14px; font: 13px/1.4 "Segoe UI", system-ui, sans-serif; background: var(--bg); color: var(--text); }
  .u { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }

  header { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  header img { width: 32px; height: 32px; }
  header .names { flex: 1; min-width: 0; }
  h1 { font-size: 15px; font-weight: 600; margin: 0; }
  .tab { color: var(--muted); font-size: 12px; }
  .state { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--muted); padding: 3px 8px; border-radius: 99px; background: var(--card); cursor: default; }
  .state i { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); }
  .state.on i { background: var(--ok); }
  .state.starting i { background: var(--warn); animation: blink 1s infinite; }
  .state.off { cursor: pointer; }
  .state.on { display: none; }  /* всё в порядке — говорить не о чем; показываем, только когда программа не готова */
  button.state { border: 0; font-weight: 400; }
  .gear { font-size: 16px; padding: 4px 8px; }
  .gear[aria-expanded="true"] { background: var(--card); color: var(--text); }
  .set { display: flex; align-items: center; gap: 6px; padding: 5px 4px 5px 10px; margin-bottom: 6px; background: var(--card); border-radius: 8px; font-size: 12px; }
  .set .label { flex: 0 0 74px; color: var(--text); white-space: nowrap; }
  .set select { flex: 1; min-width: 0; margin: 0; }
  .set .path { flex: 1; color: var(--muted); direction: rtl; text-align: left; }
  button:disabled { opacity: .45; cursor: default; filter: none; }
  button:focus-visible, select:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  footer details { margin: 0 0 0 auto; }
  footer details[open] { flex: 1 0 100%; margin-top: 6px; }
  footer details[open] summary { margin-bottom: 4px; }
  footer .ver { margin: 6px 2px 0; }
  .state.off i { background: var(--bad); }
  @keyframes blink { 50% { opacity: .3; } }

  button { border: 0; border-radius: 8px; cursor: pointer; font: inherit; font-weight: 600; color: #fff; background: var(--card); padding: 7px 10px; transition: filter .15s, background .15s; }
  button:hover { filter: brightness(1.15); }
  button:active { transform: translateY(1px); }
  button.primary { background: linear-gradient(135deg, var(--accent), var(--accent-2)); }
  button.ghost { background: transparent; color: var(--muted); font-weight: 500; padding: 5px 8px; }
  button.ghost:hover { background: var(--card); color: var(--text); filter: none; }
  button.small { padding: 5px 9px; font-size: 12px; }
  .want { display: flex; gap: 6px; margin-bottom: 8px; }
  .chip { flex: 1; padding: 8px 4px; font-weight: 500; color: var(--muted); border: 1px solid var(--line); background: transparent; }
  .chip.on { color: #fff; background: var(--card); border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
  .chip.on::before { content: "✓ "; color: var(--ok); }
  .main { display: flex; gap: 8px; }
  .main button { flex: 1; padding: 11px; font-size: 14px; }
  [hidden] { display: none !important; }

  .folder { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); margin: 10px 0 0; padding: 4px 4px 4px 10px; background: var(--card); border-radius: 8px; }
  .folder + .folder { margin-top: 6px; }
  .folder .u { flex: 1; direction: rtl; text-align: left; }
  .note { font-size: 12px; color: var(--muted); margin: 10px 2px 0; }
  .warn { color: var(--warn); }
  #err { color: var(--bad); font-size: 12px; margin: 8px 2px 0; }
  #err:empty { display: none; }

  .section { display: flex; align-items: baseline; gap: 8px; font-size: 11px; letter-spacing: .06em; color: var(--muted); text-transform: uppercase; margin: 16px 2px 6px; }
  .section span { flex: 1; text-transform: none; letter-spacing: 0; font-size: 12px; }
  .section button { margin: -4px -6px -4px 0; }

  .item { display: flex; align-items: center; gap: 8px; padding: 3px 0; }
  .item .u { flex: 1; font-size: 12px; color: var(--muted); }
  .item.video { padding: 8px; margin-bottom: 6px; background: var(--card); border-radius: 10px; border: 1px solid transparent; }
  .item.video:hover { background: var(--card-hover); border-color: var(--accent); }
  .item.video .thumb { flex: 0 0 64px; height: 36px; border-radius: 5px; background: var(--line) center / cover no-repeat; display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: 12px; }
  .item.video .thumb.has { color: transparent; }
  .item.video .info { flex: 1; min-width: 0; }
  .item.video .name { font-weight: 600; }
  .item.video .info .u { display: block; }
  .item.video.playing .name::before { content: "▶ "; color: var(--ok); }
  select { font: inherit; font-size: 12px; color: var(--text); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 3px 6px; margin: 2px 4px 2px 0; cursor: pointer; }
  #notice { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--warn); margin: 8px 0 0; padding: 6px 6px 6px 10px; background: var(--card); border-radius: 8px; }
  #notice:empty { display: none; }
  #notice span { flex: 1; }
  .tag { font-size: 11px; padding: 1px 6px; border-radius: 5px; background: var(--line); white-space: nowrap; }
  .tag.best { background: #14532d; color: #bbf7d0; }
  details { margin-top: 2px; }
  summary { font-size: 12px; color: var(--muted); cursor: pointer; padding: 2px; }

  .job { padding: 9px 10px; margin-bottom: 6px; background: var(--card); border-radius: 10px; }
  .job .top { display: flex; gap: 8px; align-items: baseline; }
  .job .title { flex: 1; }
  .job .pct { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .bar { height: 4px; background: var(--line); border-radius: 2px; margin: 7px 0 6px; overflow: hidden; }
  .bar > div { height: 100%; border-radius: 2px; background: linear-gradient(90deg, var(--accent), var(--accent-2)); transition: width .4s; }
  .job.done .bar > div { background: var(--ok); }
  .job.failed .bar > div { background: var(--bad); width: 100% !important; }
  .job.waiting .bar > div { width: 35% !important; animation: slide 1.2s infinite ease-in-out; }
  @keyframes slide { from { margin-left: -35%; } to { margin-left: 100%; } }
  .st { color: var(--muted); font-size: 12px; }
  .job.failed .st { color: var(--bad); }
  .acts { display: flex; gap: 2px; margin: 4px 0 -3px -8px; }
  .acts:empty { display: none; }

  footer { display: flex; flex-wrap: wrap; align-items: center; gap: 2px; margin-top: 12px; padding-top: 8px; border-top: 1px solid var(--line); }
  .ver { margin-left: auto; color: #5d5d6b; font-size: 11px; }
</style>
</head>
<body>
  <header>
    <img src="icon.png" alt="">
    <div class="names">
      <h1>VideoTranskeeper</h1>
      <div class="tab u" id="tabTitle"></div>
    </div>
    <button class="state" id="state" type="button"><i></i><span id="stateText">…</span></button>
    <button class="ghost gear" id="gear" type="button" title="Настройки: форматы, качество, язык речи, папка" aria-expanded="false">⚙</button>
  </header>

  <div class="want" id="want" title="Что получить: отметь одно или несколько — на каждое будет один файл">
    <button class="chip" data-want="video" type="button">🎬 Видео</button>
    <button class="chip" data-want="audio" type="button">🎵 Звук</button>
    <button class="chip" data-want="text" type="button">📝 Текст</button>
  </div>
  <div class="main">
    <button id="go" class="primary" type="button">⬇ Скачать</button>
  </div>

  <!-- всё, что программа хочет сказать в ответ на нажатие, — сразу под кнопкой -->
  <div id="err" role="alert"></div>
  <div id="notice" role="alert"></div>
  <div id="hint" class="note"></div>

  <section id="settings" hidden>
    <div class="section">Настройки</div>
    <div class="set">
      <span class="label">🎬 Видео</span>
      <select id="fVideo" title="В каком виде сохранять видео">
        <option value="mp4">MP4 — играет везде</option>
        <option value="best">Максимальное качество (MKV)</option>
      </select>
      <select id="quality" title="Не качать видео крупнее, чем нужно">
        <option value="0">любой размер</option>
        <option value="2160">до 4K</option>
        <option value="1440">до 1440p</option>
        <option value="1080">до 1080p</option>
        <option value="720">до 720p</option>
        <option value="480">до 480p</option>
      </select>
    </div>
    <div class="set">
      <span class="label">🎵 Звук</span>
      <select id="fAudio" title="В каком виде сохранять звук">
        <option value="m4a">M4A — без потери качества</option>
        <option value="mp3">MP3 — привычный</option>
      </select>
    </div>
    <div class="set">
      <span class="label">📝 Текст</span>
      <select id="fText" title="В каком виде сохранять текст">
        <option value="txt">Обычный текст (.txt)</option>
        <option value="timed">Текст с отметками времени</option>
        <option value="srt">Субтитры (.srt)</option>
      </select>
      <select id="language" title="На каком языке говорят в видео">
        <option value="auto">язык: сам</option>
        <option value="ru">русский</option>
        <option value="multi">англ. и европейские</option>
      </select>
    </div>
    <div class="set">
      <span class="label">📁 Папка</span>
      <span id="folderPath" class="u path"></span>
      <button id="chooseFolder" class="ghost small" type="button">Сменить</button>
    </div>
  </section>

  <div id="queue"></div>
  <div id="caught"></div>

  <footer>
    <button id="folder" class="ghost small" type="button">📁 Открыть папку</button>
    <details id="more">
      <summary>Ещё</summary>
      <button id="all" class="ghost small" type="button">Все вкладки</button>
      <button id="logs" class="ghost small" type="button" title="Журналы работы — пригодятся, если что-то пошло не так">Файлы для разработчика</button>
      <div class="ver" id="ver"></div>
    </details>
  </footer>
  <script type="module" src="popup.js"></script>
</body>
</html>
