# Настройки инструментов проверки. Сам проект не собирается в пакет — это набор скриптов.

[tool.vulture]
# Имена, которые вызываются не из нашего кода, а по имени — поиск мёртвого кода их вызовов не видит:
#   do_*            — http.server сам зовёт do_GET / do_POST / do_OPTIONS;
#   _status … _retry — методы из таблицы адресов ROUTES в kachalka/api.py (вызов через getattr);
#   остальные       — классы тестов, их находит и запускает unittest.
ignore_names = [
    "do_*",
    "_status", "_open_folder", "_open_logs", "_open_file", "_open_log", "_clear", "_cancel", "_retry", "_choose_folder",
    "PickFormat", "JobKind", "PlanAttempts", "Texts", "Names", "Probe", "SameVideo", "Routes",
    "Language", "Text", "WhatToDownload", "FileNames",
    "TextAhead", "Connections", "TempFolder", "Toast",
    "ParseJob", "Claim", "Ready", "Checksum", "Resume", "Merge", "Split", "Noise", "Joins", "Russian", "Threads",
    "window_size",  # ещё одно поле настроек детектора речи sherpa-onnx
    "Settings", "DownloadFormat", "TextForms", "Partial",
    "allow_reuse_address",  # поле сервера: его читает стандартная библиотека при занятии порта
    "Gate", "Errors", "Cookies", "WindowsNames",
    # настройки детектора речи: это поля чужого объекта sherpa-onnx, мы их только задаём
    "min_silence_duration", "max_speech_duration",
]
